def unsignedLocalProof = providers.gradleProperty('unsignedLocalProof').orNull == 'true'
def localPublishOnly = gradle.startParameter.taskNames && gradle.startParameter.taskNames.every {
    it == 'publishToMavenLocal' || it == ':publishToMavenLocal'
}
if (unsignedLocalProof && !localPublishOnly) {
    throw new GradleException('unsignedLocalProof is restricted to publishToMavenLocal')
}

mavenPublishing {
    publishToMavenCentral()
    if (!unsignedLocalProof) {
        signAllPublications()
    }
    coordinates(project.group, project.name, project.version)
    pom {
        name = 'Kotest Allure Integration'
        description = 'Allure Listener for Kotest and some extra functions'
        url = 'https://github.com/kochetkov-ma/kotest-allure'
        inceptionYear = '2021'

        licenses {
            license {
                name = 'The Apache License, Version 2.0'
                url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                distribution = 'repo'
            }
        }

        developers {
            developer {
                id = 'kochetkov-ma'
                name = 'Maksim Kochetkov'
                email = 'apmatypa88@gmail.com'
            }
        }

        scm {
            url = 'https://github.com/kochetkov-ma/kotest-allure'
            connection = 'scm:git:https://github.com/kochetkov-ma/kotest-allure.git'
            developerConnection = 'scm:git:ssh://git@github.com/kochetkov-ma/kotest-allure.git'
        }
    }
}

if (!unsignedLocalProof && !providers.gradleProperty('signingInMemoryKey').isPresent()) {
    def signingKey = System.getenv('GPG_SIGNING_KEY')
    def signingKeyPath = findProperty('signing.key.path')
    if (!signingKey && signingKeyPath) {
        def signingKeyFile = file(signingKeyPath)
        if (signingKeyFile.isFile()) {
            signingKey = signingKeyFile.text
        }
    }
    if (signingKey) {
        signing.useInMemoryPgpKeys(signingKey, findProperty('signing.password') as String ?: '')
    }
}
