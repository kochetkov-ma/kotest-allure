name: Build

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.14.5
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          gradle-version: '8.14.5'
          cache-provider: basic

      - name: Run full checks
        run: ./gradlew clean check --no-daemon
