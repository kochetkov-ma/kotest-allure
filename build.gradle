import static org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21

plugins {
    id 'idea'
    id 'signing'
    id 'maven-publish'

    id 'org.jetbrains.kotlin.jvm' version "$kotlinVersion"
    id 'io.qameta.allure-report' version "$allurePluginVersion"
    id 'com.vanniktech.maven.publish' version "$vanniktechPublishPluginVersion"
    id 'com.github.ben-manes.versions' version "$benManesPluginVersion"
    id 'ru.iopump.qa.allure' version "$allureServerPluginVersion"
    id("io.kotest") version "$kotestVersion"
}
group 'ru.iopump.kotest'

apply from: "$rootDir/gradle/publishing.gradle"

kotlin {
    jvmToolchain(21)
    compilerOptions {
        jvmTarget = JVM_21
    }
}

wrapper {
    gradleVersion = "$gradleWrapperVersion"
}

repositories {
    mavenCentral()
}

configurations {
    aspectjWeaverAgent {
        canBeConsumed = false
        canBeResolved = true
    }
}

dependencies {
    aspectjWeaverAgent "org.aspectj:aspectjweaver:$aspectJVersion"
    implementation(platform("io.kotest:kotest-bom:$kotestVersion"))
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
    implementation "org.jetbrains.kotlin:kotlin-reflect"
    api("io.kotest:kotest-framework-engine-jvm:$kotestVersion") { exclude group: 'org.jetbrains.kotlin' }

    api "org.opentest4j:opentest4j:$opentest4jVersion"
    api "io.qameta.allure:allure-java-commons:$allureJavaVersion"

    testImplementation("io.kotest:kotest-assertions-table:$kotestVersion")
    testImplementation("io.kotest:kotest-property-jvm:$kotestVersion")
    testImplementation "com.google.code.gson:gson:$gsonVersion"
    testImplementation "org.slf4j:slf4j-simple:$slf4jVersion"
    testImplementation("io.kotest:kotest-runner-junit5-jvm") {
        exclude group: 'org.jetbrains.kotlin'
        exclude group: 'io.mockk'
    }
}

tasks.withType(Test).configureEach {
    inputs.files(project.configurations.aspectjWeaverAgent)
        .withPropertyName("aspectjWeaverAgent")
        .withPathSensitivity(org.gradle.api.tasks.PathSensitivity.RELATIVE)
    doFirst {
        jvmArgs "-javaagent:${project.configurations.aspectjWeaverAgent.singleFile.absolutePath}"
    }
}

test {
    include "**/ExampleDataDrivenSpec.class"
    systemProperty "allure.results.directory", layout.buildDirectory.dir("allure-unit-results").get().asFile
    useJUnitPlatform()
    systemProperty("kotest.framework.config.fqn", "ru.iopump.kotest.allure.ProjectConfiguration")
    systemProperty "kotest.framework.dump.config", "true"
    systemProperty "KOTEST_DEBUG", "true"
}

def allureFixtureResults = layout.buildDirectory.dir("allure-fixture-results")
def allureLegacyResults = layout.buildDirectory.dir("allure-legacy-results")
def allureReportRoot = layout.buildDirectory.dir("reports/allure-report/allureReport")

tasks.register("allureFixtureTest", Test) {
    group = "verification"
    description = "Runs report fixtures, including intentional failures and skips."
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include "**/AllureListenerFixtureSpec.class"
    useJUnitPlatform()
    ignoreFailures = true
    systemProperty "allure.results.directory", allureFixtureResults.get().asFile
    systemProperty "kotest.framework.config.fqn", "ru.iopump.kotest.allure.ProjectConfiguration"
    doFirst { delete allureFixtureResults.get().asFile }
}

tasks.register("legacyExamplesTest", Test) {
    group = "verification"
    description = "Runs legacy examples with expected failures."
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include "**/Example*Spec.class", "**/BigSpecSpec.class"
    useJUnitPlatform()
    ignoreFailures = true
    systemProperty "allure.results.directory", allureLegacyResults.get().asFile
    systemProperty "kotest.framework.config.fqn", "ru.iopump.kotest.allure.ProjectConfiguration"
    doFirst { delete allureLegacyResults.get().asFile }
}

// The plugin's self-project input is built by every Test task, including the report contract.
configurations.allureReport.dependencies.removeAll { dependency ->
    dependency instanceof org.gradle.api.artifacts.ProjectDependency && dependency.dependencyProject == project
}

dependencies {
    allureReport(files(allureFixtureResults))
}

tasks.named("allureReport") {
    dependsOn tasks.named("allureFixtureTest")
    clean.set(true)
}

tasks.register("allureResultContractTest", Test) {
    group = "verification"
    description = "Verifies generated Allure raw results and HTML report."
    dependsOn tasks.named("allureReport")
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include "**/AllureGeneratedResultContractSpec.class"
    useJUnitPlatform()
    systemProperty "allure.results.directory", layout.buildDirectory.dir("allure-contract-results").get().asFile
    systemProperty "kotest.framework.config.fqn", "ru.iopump.kotest.allure.ProjectConfiguration"
    systemProperty "contract.results.dir", allureFixtureResults.get().asFile
    systemProperty "contract.report.dir", allureReportRoot.get().asFile
}

tasks.register("legacyExamplesContractTest", Test) {
    group = "verification"
    description = "Verifies expected legacy example outcomes in XML and Allure results."
    dependsOn tasks.named("legacyExamplesTest")
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include "**/LegacyExamplesResultContractSpec.class"
    useJUnitPlatform()
    systemProperty "allure.results.directory", layout.buildDirectory.dir("allure-legacy-contract-results").get().asFile
    systemProperty "kotest.framework.config.fqn", "ru.iopump.kotest.allure.ProjectConfiguration"
    systemProperty "contract.legacy.xml.dir", layout.buildDirectory.dir("test-results/legacyExamplesTest").get().asFile
    systemProperty "contract.legacy.results.dir", allureLegacyResults.get().asFile
}

tasks.named("check") {
    dependsOn tasks.named("allureResultContractTest")
    dependsOn tasks.named("legacyExamplesContractTest")
}

allure {
    version = project.property("allureReportVersion")
    report {
        dependsOnTests.set(false)
    }
}

dependencyUpdates {
    gradleReleaseChannel = 'current'
}

tasks.register("cleanAllureResult") {
    group = 'verification'
    doLast {
        delete layout.buildDirectory.dir("allure-unit-results").get().asFile
    }
}

allureServer {
    relativeResultDir = 'build/allure-unit-results'
    allureServerUrl = 'https://allure.iopump.ru'
}
