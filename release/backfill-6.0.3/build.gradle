import static org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11

plugins {
    id 'java-library'
    id 'signing'
    id 'maven-publish'
    id 'org.jetbrains.kotlin.jvm' version "$kotlinVersion"
    id 'com.vanniktech.maven.publish' version "$vanniktechPublishPluginVersion"
}

group = 'ru.iopump.kotest'

apply from: "$rootDir/gradle/publishing.gradle"

kotlin {
    jvmToolchain(21)
    compilerOptions {
        jvmTarget = JVM_11
        freeCompilerArgs.add('-Xjdk-release=11')
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 11
}

repositories {
    mavenCentral()
}

configurations {
    aspectjWeaverAgent {
        canBeConsumed = false
        canBeResolved = true
    }
}

dependencies {
    aspectjWeaverAgent "org.aspectj:aspectjweaver:$aspectJVersion"

    implementation(platform("io.kotest:kotest-bom:$kotestVersion"))
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8'
    implementation 'org.jetbrains.kotlin:kotlin-reflect'
    api("io.kotest:kotest-framework-engine-jvm:$kotestVersion") { exclude group: 'org.jetbrains.kotlin' }
    api "org.opentest4j:opentest4j:$opentest4jVersion"
    api "io.qameta.allure:allure-java-commons:$allureJavaVersion"

    testImplementation "io.kotest:kotest-assertions-table:$kotestVersion"
    testImplementation "io.kotest.extensions:kotest-property-arbs:$kotestPropertyArbsVersion"
    testImplementation "org.slf4j:slf4j-simple:$slf4jVersion"
    testImplementation('io.kotest:kotest-runner-junit5-jvm') {
        exclude group: 'org.jetbrains.kotlin'
        exclude group: 'io.mockk'
    }
}

tasks.withType(Test).configureEach {
    inputs.files(configurations.aspectjWeaverAgent)
        .withPropertyName('aspectjWeaverAgent')
        .withPathSensitivity(PathSensitivity.RELATIVE)
    doFirst {
        jvmArgs "-javaagent:${configurations.aspectjWeaverAgent.singleFile.absolutePath}"
    }
}

test {
    include '**/ExampleDataDrivenSpec.class'
    systemProperty 'allure.results.directory', layout.buildDirectory.dir('allure-results').get().asFile
    systemProperty 'kotest.framework.config.fqn', 'ru.iopump.kotest.allure.ProjectConfiguration'
    useJUnitPlatform()
}
